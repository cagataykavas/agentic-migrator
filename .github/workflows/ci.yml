name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check migrator tests examples
      - name: Pytest
        run: pytest -q
      - name: Synthetic benchmark
        run: python examples/benchmark_report.py
      - name: CLI smoke test
        run: agentic-migrator scan . --format json --output /tmp/migration-plan.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t agentic-migrator:ci .
      - name: Smoke-test Docker entrypoint
        run: docker run --rm agentic-migrator:ci --help
